# Moved from wicflow-clients-1 (/etc/hackathon-demos/preparedhome) on 18.11.2026; same images and lockdown as there.
# /video* goes to the nginx, everything else to the API. Certificates: Traefik resolver "zerossl" (acme-zerossl.json).
name: preparedhome-demo
x-lockdown: &lockdown
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  networks: [n8n_default]
services:
  app:
    <<: *lockdown
    image: preparedhome-demo:db735b5e
    container_name: preparedhome-demo-api
    user: "1000:1000"
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    env_file: [{path: ./private.env, format: raw}]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.preparedhome-demo.rule=Host(`preparedhome.demo.wicflow.com`)"
      - "traefik.http.routers.preparedhome-demo.entrypoints=websecure"
      - "traefik.http.routers.preparedhome-demo.tls.certresolver=zerossl"
      - "traefik.http.routers.preparedhome-demo.middlewares=preparedhome-demo-headers"
      - "traefik.http.middlewares.preparedhome-demo-headers.headers.customresponseheaders.Server="
      - "traefik.http.middlewares.preparedhome-demo-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.middlewares.preparedhome-demo-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.preparedhome-demo-headers.headers.referrerPolicy=no-referrer"
      - "traefik.http.services.preparedhome-demo.loadbalancer.server.port=8787"
  video:
    <<: *lockdown
    image: demo-video-nginx:65645c7b
    container_name: preparedhome-demo-video
    user: "101:101"
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    tmpfs: ["/run:rw,nosuid,size=8m,uid=101,gid=101", "/var/cache/nginx:rw,nosuid,size=16m,uid=101,gid=101"]
    volumes:
      - ./video/site:/usr/share/nginx/html/video:ro
      - ./video.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.preparedhome-demo-video.rule=Host(`preparedhome.demo.wicflow.com`) && PathPrefix(`/video`)"
      - "traefik.http.routers.preparedhome-demo-video.entrypoints=websecure"
      - "traefik.http.routers.preparedhome-demo-video.tls.certresolver=zerossl"
      - "traefik.http.services.preparedhome-demo-video.loadbalancer.server.port=80"
networks:
  n8n_default:
    external: true
