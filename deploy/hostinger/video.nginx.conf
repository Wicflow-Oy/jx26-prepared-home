server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /video/; }
    location /video/ {
        try_files $uri $uri/ =404;
        location ~* \.mp4$ { add_header Cache-Control "public, max-age=3600"; add_header X-Robots-Tag "noindex, nofollow" always; }
    }
}
