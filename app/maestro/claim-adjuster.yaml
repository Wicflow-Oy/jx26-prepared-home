# Example flat: report a leak (demo); the claims handler view shows "Relief not applied" because L4 is Fix first.
# Needs the API server (port 8787).
# Expo Go. For a development build change appId to fi.wicflow.preparedhome and APP_LINK to preparedhome://?example=flat
appId: host.exp.exponent
env:
  APP_LINK: exp://127.0.0.1:8081/--/?example=flat
---
- runFlow:
    file: subflows/open-app.yaml
    env:
      APP_LINK: ${APP_LINK}
- scrollUntilVisible:
    element:
      id: nav-claim
    direction: DOWN
- tapOn:
    id: nav-claim
- scrollUntilVisible:
    element:
      id: send-report
    direction: DOWN
    timeout: 10000
- tapOn:
    id: send-report
- extendedWaitUntil:
    visible:
      id: report-sent
    timeout: 30000
- scrollUntilVisible:
    element:
      id: open-handler-view
    direction: DOWN
- tapOn:
    id: open-handler-view
- extendedWaitUntil:
    visible:
      id: adjuster-decision-text
    timeout: 10000
- assertVisible:
    id: adjuster-decision-text
    text: Relief not applied
- scrollUntilVisible:
    element:
      id: adjuster-note
    direction: DOWN
