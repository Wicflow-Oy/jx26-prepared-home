# Example flat: Leak is 5 of 6, and the status screen shows the leak deductible.
# Expo Go. For a development build change appId to fi.wicflow.preparedhome and APP_LINK to preparedhome://?example=flat
appId: host.exp.exponent
env:
  APP_LINK: exp://127.0.0.1:8081/--/?example=flat
---
- runFlow:
    file: subflows/open-app.yaml
    env:
      APP_LINK: ${APP_LINK}
- assertVisible:
    id: home-peril-count-leak
    text: 5 of 6
- scrollUntilVisible:
    element:
      id: nav-status
    direction: DOWN
- tapOn:
    id: nav-status
- extendedWaitUntil:
    visible:
      id: status-screen
    timeout: 10000
- assertVisible:
    id: peril-count-leak
    text: 5 of 6
- assertVisible:
    id: deductible-leak
