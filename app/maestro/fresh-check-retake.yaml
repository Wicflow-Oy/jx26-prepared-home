# New flat: open the floor drain check (L5), use an unclear example photo (B07) and see the red X
# with what went wrong and what to try. Needs the API server (port 8787); B07 has a saved result.
# Expo Go. For a development build change appId to fi.wicflow.preparedhome and APP_LINK to preparedhome://?example=fresh
appId: host.exp.exponent
env:
  APP_LINK: exp://127.0.0.1:8081/--/?example=fresh
---
- runFlow:
    file: subflows/open-app.yaml
    env:
      APP_LINK: ${APP_LINK}
- scrollUntilVisible:
    element:
      id: check-row-L5
    direction: DOWN
- tapOn:
    id: check-row-L5
- extendedWaitUntil:
    visible:
      id: check-screen
    timeout: 10000
- assertVisible:
    id: coach-line
- assertVisible:
    id: photo-info
- tapOn:
    id: use-sample
- extendedWaitUntil:
    visible:
      id: sample-B07
    timeout: 20000
- tapOn:
    id: sample-B07
- extendedWaitUntil:
    visible:
      id: badge-bad
    timeout: 60000
- assertVisible:
    id: problem
- assertVisible:
    id: tips
- assertVisible:
    id: try-again
